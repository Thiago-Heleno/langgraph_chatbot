name: aprendizado

services:
  fast-mcp:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: python -m apps.fast_mcp
    env_file: ../.env
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: "7000"
    restart: unless-stopped

  fast-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: uvicorn apps.fast_api:app --host 0.0.0.0 --port 8000
    env_file: ../.env
    environment:
      MCP_SERVER_URL: http://fast-mcp:7000/mcp
      DATABASE_PATH: /app/data/app.db
      CHECKPOINT_DB_PATH: /app/data/app.db
    volumes:
      - db-data:/app/data
    ports:
      - "8000:8000"
    depends_on:
      - fast-mcp
    restart: unless-stopped

  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - fast-api
    restart: unless-stopped

volumes:
  db-data:
